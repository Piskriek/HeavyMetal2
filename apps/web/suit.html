<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Astro Suit — Creature Kit</title>
<style>
  :root { --bg: #0b0e13; --ink: #e6edf3; --dim: #8b949e; --edge: rgba(255,255,255,.12); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 Inter, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #bar { position: fixed; left: 12px; top: 10px; z-index: 2; background: rgba(13,17,23,.85); border: 1px solid var(--edge); padding: 8px 12px; border-radius: 6px; }
  #bar b { font-family: Oxanium, monospace; letter-spacing: .04em; }
  #bar span { color: var(--dim); }
  #parts { position: fixed; right: 12px; top: 10px; bottom: 10px; width: 236px; overflow: auto; z-index: 2;
    background: rgba(13,17,23,.85); border: 1px solid var(--edge); border-radius: 6px; padding: 8px 10px; }
  #parts h4 { margin: 10px 0 4px; font-family: Oxanium, monospace; font-size: 11px; letter-spacing: .08em; color: #3dc8ff; text-transform: uppercase; }
  #parts button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: inherit; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  #parts button:hover { background: rgba(61,200,255,.16); }
  #parts button.on { background: rgba(61,200,255,.28); }
</style>
</head>
<body>
<div id="stage"><canvas id="view"></canvas></div>
<div id="bar"><b>ASTRO SUIT</b> <span id="info">loading…</span></div>
<div id="parts"></div>
<script type="module" src="/src/dev/suit.ts"></script>
</body>
</html>
