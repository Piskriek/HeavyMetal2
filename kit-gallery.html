<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meshy Kit Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --plate: #0f1814; --deep: #0a110d; --line: #33402f; --brass: #d6ad5c; --brass-hi: #f0c878; --ink: #e8d9ad; --moss: #9aa68d; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--deep); color: var(--ink); font: 14px/1.4 'DM Sans', sans-serif; }
    body { display: grid; grid-template-columns: 260px 1fr; }
    aside { display: flex; flex-direction: column; min-height: 0; border-right: 2px solid #33281a; background: linear-gradient(180deg, #16211b, var(--plate)); box-shadow: inset -1px 0 #d6ad5c33; }
    header { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font: 700 20px 'Cinzel', serif; color: var(--brass-hi); }
    header p { margin: 4px 0 0; color: var(--moss); font-size: 12.5px; }
    .tiers { display: flex; gap: 4px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
    .tiers button { flex: 1; height: 30px; border: 1px solid #4b3a20; border-radius: 3px; background: #111814; color: var(--ink); font: 600 12.5px 'DM Sans', sans-serif; cursor: pointer; }
    .tiers button[aria-pressed='true'] { border-color: var(--brass-hi); color: var(--brass-hi); background: #2a1d12; }
    ul { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
    li button { width: 100%; display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border: 1px solid transparent; border-radius: 3px; background: none; color: var(--ink); font: 500 13.5px 'DM Sans', sans-serif; text-align: left; cursor: pointer; }
    li button:hover { background: #16211b; }
    li button[aria-current='true'] { border-color: var(--brass); background: #2a1d12; color: var(--brass-hi); }
    li small { color: var(--moss); font-size: 11.5px; }
    .group { padding: 10px 10px 4px; font: 600 13px 'Cinzel', serif; color: var(--brass); }
    main { position: relative; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .info { position: absolute; left: 16px; bottom: 14px; padding: 8px 12px; border: 1px solid #604722; border-radius: 3px; background: #0a110dd9; }
    .info h2 { margin: 0; font: 700 18px 'Cinzel', serif; color: var(--brass-hi); }
    .info p { margin: 2px 0 0; color: var(--moss); font-size: 12.5px; }
    .hint { position: absolute; right: 16px; bottom: 14px; color: var(--moss); font-size: 12px; }
    :focus-visible { outline: 2px solid #ffe39c; outline-offset: 2px; }
  </style>
</head>
<body>
  <aside>
    <header><h1>Meshy kit</h1><p>Every generated model, as the game will load it.</p></header>
    <div class="tiers" role="group" aria-label="Detail">
      <button data-tier="" aria-pressed="true">Full</button>
      <button data-tier=".lod" aria-pressed="false">Low</button>
      <button data-tier=".collision" aria-pressed="false">Collision</button>
      <button data-tier=".drive" aria-pressed="false">Drive</button>
    </div>
    <ul id="list"></ul>
  </aside>
  <main>
    <div class="info"><h2 id="name">Loading…</h2><p id="stats"></p></div>
    <div class="hint">Drag to orbit · scroll to zoom · arrow keys for the next model</div>
  </main>
  <script type="module" src="/src/dev/kit-gallery.ts"></script>
</body>
</html>
